<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 4.2.5 — ReportLab Automated Forensic Report Generation Pipeline Flowchart</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        svg {
            width: 100%;
            height: auto;
        }
        .caption {
            margin-top: 25px;
            font-size: 16px;
            font-style: italic;
            color: #000000;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 540 1020" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
            </marker>
        </defs>

        <!-- START OVAL -->
        <rect x="210" y="20" width="120" height="40" rx="20" ry="20" fill="#e5e7eb" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="45" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">START</text>

        <!-- Line 1 -->
        <line x1="270" y1="60" x2="270" y2="85" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 1: Ingestion -->
        <rect x="130" y="85" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="103" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Receive Incident Trigger Payload</text>
        <text x="270" y="119" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(FastAPI Webhook / REST API)</text>

        <!-- Line 2 -->
        <line x1="270" y1="130" x2="270" y2="155" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 2: Validation -->
        <rect x="130" y="155" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="173" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Validate JSON Schema & Triage Data</text>
        <text x="270" y="189" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(Pydantic DFIRTriageResult Model)</text>

        <!-- Line 3 -->
        <line x1="270" y1="200" x2="270" y2="225" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- DIAMOND 1: Schema Valid? -->
        <polygon points="270,225 345,260 270,295 195,260" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="264" font-family="'Arial', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">Payload Valid?</text>

        <!-- No Branch (Right) -->
        <line x1="345" y1="260" x2="400" y2="260" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="365" y="252" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#000000">No</text>

        <rect x="400" y="240" width="130" height="40" rx="2" fill="#f3f4f6" stroke="#000000" stroke-width="1.6"/>
        <text x="465" y="256" font-family="'Arial', sans-serif" font-size="10" text-anchor="middle" fill="#000000">Log Error & Return</text>
        <text x="465" y="271" font-family="'Arial', sans-serif" font-size="10" text-anchor="middle" fill="#000000">HTTP 400 Bad Request</text>

        <!-- Yes Branch (Down) -->
        <line x1="270" y1="295" x2="270" y2="325" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="282" y="313" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#000000">Yes</text>

        <!-- STEP 3: Forensic Stream -->
        <rect x="130" y="325" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="343" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Extract Windows Event 4625 Stream</text>
        <text x="270" y="359" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(5 Failed Logons, Timestamps, Source IP)</text>

        <!-- Line 4 -->
        <line x1="270" y1="370" x2="270" y2="395" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 4: NTSTATUS Decoding -->
        <rect x="130" y="395" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="413" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Decode NTSTATUS Sub-Status Code</text>
        <text x="270" y="429" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(0xC000006A &rarr; STATUS_WRONG_PASSWORD)</text>

        <!-- Line 5 -->
        <line x1="270" y1="440" x2="270" y2="465" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 5: MITRE Mapping -->
        <rect x="130" y="465" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="483" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Map Threat to MITRE ATT&CK Framework</text>
        <text x="270" y="499" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(T1110.001 - Brute Force Password Guessing)</text>

        <!-- Line 6 -->
        <line x1="270" y1="510" x2="270" y2="535" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 6: Cryptographic Hash -->
        <rect x="130" y="535" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="553" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Compute Cryptographic Evidence Hash</text>
        <text x="270" y="569" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(SHA-256 Digital Chain of Custody)</text>

        <!-- Line 7 -->
        <line x1="270" y1="580" x2="270" y2="605" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- DIAMOND 2: Hash Verified? -->
        <polygon points="270,605 345,640 270,675 195,640" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="644" font-family="'Arial', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">Hash Verified?</text>

        <!-- No Branch (Right) -->
        <line x1="345" y1="640" x2="400" y2="640" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="365" y="632" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#000000">No</text>

        <rect x="400" y="620" width="130" height="40" rx="2" fill="#f3f4f6" stroke="#000000" stroke-width="1.6"/>
        <text x="465" y="636" font-family="'Arial', sans-serif" font-size="10" text-anchor="middle" fill="#000000">Flag Hash Failure</text>
        <text x="465" y="651" font-family="'Arial', sans-serif" font-size="10" text-anchor="middle" fill="#000000">Alert SOC Integrity Error</text>

        <!-- Yes Branch (Down) -->
        <line x1="270" y1="675" x2="270" y2="705" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="282" y="693" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#000000">Yes</text>

        <!-- STEP 7: ReportLab Initialization -->
        <rect x="130" y="705" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="723" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Initialize ReportLab SimpleDocTemplate</text>
        <text x="270" y="739" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(Page Margins, Custom Palette & Typography)</text>

        <!-- Line 8 -->
        <line x1="270" y1="750" x2="270" y2="775" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 8: Construct Flowables -->
        <rect x="130" y="775" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="793" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Construct Flowable Document Elements</text>
        <text x="270" y="809" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(Executive Summary, Tables, SOAR Playbook)</text>

        <!-- Line 9 -->
        <line x1="270" y1="820" x2="270" y2="845" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 9: Compile Canvas -->
        <rect x="130" y="845" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="863" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Compile & Render Document Canvas</text>
        <text x="270" y="879" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(Execute doc.build() PDF Vector Engine)</text>

        <!-- Line 10 -->
        <line x1="270" y1="890" x2="270" y2="915" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- STEP 10: Storage -->
        <rect x="130" y="915" width="280" height="45" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="933" font-family="'Arial', sans-serif" font-size="11.5" text-anchor="middle" fill="#000000">Save PDF to reports/ & Expose via API</text>
        <text x="270" y="949" font-family="'Arial', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">(INC-XXXXXX_DFIR_Report.pdf Dispatched)</text>

        <!-- Line 11 -->
        <line x1="270" y1="960" x2="270" y2="980" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- END OVAL -->
        <rect x="210" y="980" width="120" height="35" rx="17.5" ry="17.5" fill="#e5e7eb" stroke="#000000" stroke-width="1.8"/>
        <text x="270" y="1002" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">END</text>
    </svg>
    <div class="caption">Figure 4.2.5 &mdash; ReportLab Automated Forensic Report Generation Pipeline Flowchart</div>
</div>

</body>
</html>
